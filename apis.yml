name: Enjoy Technologies
description: Enjoy Technology (Enjoy Technologies) was a "commerce at home" mobile-retail startup
  founded in 2014 by Ron Johnson, the former Apple senior vice president of retail and JCPenney CEO,
  and headquartered in Palo Alto, California. The company brought the retail store experience to
  customers' homes, dispatching mobile experts to deliver, set up, and demonstrate consumer
  electronics on behalf of partners such as carriers and device makers. Backed by Kleiner Perkins,
  Oak Investment Partners, and Andreessen Horowitz (a16z), Enjoy went public via SPAC in 2021 and
  declared bankruptcy in 2022, with its assets subsequently acquired. Enjoy never operated a public
  developer program or API; this profile is retained as a historical portfolio-company record.
